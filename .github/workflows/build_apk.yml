name: Build Virtual Navbar APK

on:
  workflow_dispatch: # इसे मैन्युअल रूप से रन करने के लिए
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Android Project Files
      run: |
        mkdir -p app/src/main/java/com/example/virtualnav
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "VirtualNav"
        include ':app'
        EOF

        # 2. build.gradle (Project level)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '9.4.1' apply false
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.example.virtualnav'
            compileSdk 35

            defaultConfig {
                applicationId "com.example.virtualnav"
                minSdk 21
                targetSdk 35
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        kotlin {
            compilerOptions {
                jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_compass"
                android:label="Virtual Navbar"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".NavService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        # 5. accessibility_service_config.xml
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_description" />
        EOF

        # 6. strings.xml
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Virtual Navbar</string>
            <string name="accessibility_description">Screen par Virtual Navigation Buttons show karne ke liye ise ON karein.</string>
        </resources>
        EOF

        # 7. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/virtualnav/MainActivity.kt
        package com.example.virtualnav

        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                // Overlay Permission Check
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                    val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                    startActivityForResult(intent, 101)
                    Toast.makeText(this, "Please grant 'Display over other apps' permission", Toast.LENGTH_LONG).show()
                } else {
                    Toast.makeText(this, "Ab Accessibility Settings me jaakar 'Virtual Navbar' ko ON karein.", Toast.LENGTH_LONG).show()
                    // Open Accessibility Settings
                    val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                    startActivity(intent)
                }
            }
        }
        EOF

        # 8. NavService.kt (The Core Logic)
        cat << 'EOF' > app/src/main/java/com/example/virtualnav/NavService.kt
        package com.example.virtualnav

        import android.accessibilityservice.AccessibilityService
        import android.graphics.Color
        import android.graphics.PixelFormat
        import android.os.Build
        import android.view.Gravity
        import android.view.View
        import android.view.WindowManager
        import android.view.accessibility.AccessibilityEvent
        import android.widget.Button
        import android.widget.LinearLayout

        class NavService : AccessibilityService() {

            private lateinit var windowManager: WindowManager
            private lateinit var layout: LinearLayout

            override fun onServiceConnected() {
                super.onServiceConnected()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                createOverlay()
            }

            private fun createOverlay() {
                layout = LinearLayout(this).apply {
                    orientation = LinearLayout.HORIZONTAL
                    setBackgroundColor(Color.parseColor("#CC000000")) // Semi-transparent black
                    layoutParams = LinearLayout.LayoutParams(
                        LinearLayout.LayoutParams.MATCH_PARENT,
                        LinearLayout.LayoutParams.WRAP_CONTENT
                    )
                }

                val backBtn = createButton("◁") { performGlobalAction(GLOBAL_ACTION_BACK) }
                val homeBtn = createButton("○") { performGlobalAction(GLOBAL_ACTION_HOME) }
                val recentBtn = createButton("□") { performGlobalAction(GLOBAL_ACTION_RECENTS) }

                layout.addView(backBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                layout.addView(homeBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                layout.addView(recentBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                } else {
                    WindowManager.LayoutParams.TYPE_PHONE
                }

                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    type,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                    WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.BOTTOM
                }

                try {
                    windowManager.addView(layout, params)
                } catch (e: Exception) {
                    e.printStackTrace()
                }
            }

            private fun createButton(text: String, action: () -> Unit): Button {
                return Button(this).apply {
                    this.text = text
                    textSize = 24f
                    setTextColor(Color.WHITE)
                    setBackgroundColor(Color.TRANSPARENT)
                    setOnClickListener { action() }
                }
            }

            override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

            override fun onInterrupt() {}

            override fun onDestroy() {
                super.onDestroy()
                if (::layout.isInitialized) {
                    windowManager.removeView(layout)
                }
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Virtual-Navbar-APK
        path: app/build/outputs/apk/debug/app-debug.apk
